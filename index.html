<style>

.chip.pd{border-color:var(--cy);color:var(--cy)}
.mv{font-size:11px;font-weight:700;margin-left:4px}.tg{background:#ffffff22;border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:16px}.tg:hover{transform:rotate(180deg);transition:.4s}
.task.hot{animation:up .5s both,glow 1.6s 1s infinite;border-color:var(--red)}@keyframes glow{50%{box-shadow:0 0 14px var(--red)}}.wide{overflow-x:auto}

@keyframes fire{0%{transform:scale(1);box-shadow:0 0 0 0 var(--cy)}40%{transform:scale(1.25)}100%{transform:scale(1);box-shadow:0 0 0 22px transparent}}

.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,130px));gap:20px;justify-content:center;max-width:620px}

.pav{width:100px;height:100px;border-radius:14px;display:grid;place-items:center;font-size:34px;font-weight:700;color:#fff;background:hsl(var(--h) 70% 48%);border:3px solid transparent;transition:.2s}
.top{flex-wrap:wrap}.pod{min-width:0}.pod .nm{word-break:break-word}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(290px,100%),1fr))}
.form input:not([type=number]):not([type=datetime-local]),.form select{flex:1 1 150px}
@media(max-width:600px){
.wrap{padding:10px}
header{padding:16px 14px;border-radius:16px}
.stats{grid-template-columns:repeat(2,1fr)}.stats .card:last-child:nth-child(odd){grid-column:1/-1}.stat b{font-size:22px}
.podium{gap:4px;min-height:200px}.pod .bar{padding:8px 2px}.pod .pt{font-size:18px}.pod .nm{font-size:12px}.pod .tags{font-size:10px}.pod .av{width:36px;height:36px;font-size:13px}
.row{padding:8px;gap:8px}.row .tags{font-size:11px}.pts{font-size:17px;min-width:40px}
.btn{padding:9px 12px}.chip{padding:6px 11px}
input,select,textarea{font-size:16px}
.card{padding:12px}
.ov .card{width:100%}
.pg{grid-template-columns:repeat(2,1fr);gap:16px}.pav{width:84px;height:84px;font-size:28px}
.task h3{flex-wrap:wrap}
#toast{width:max-content;max-width:90vw;text-align:center}
}
.cmt{margin-top:8px;font-size:13px}.cmt summary{cursor:pointer;color:var(--cy)}
</style>

<script>
const $=s=>document.querySelector(s);
let S={members:[{"id":"m1","n":"Youssef Amr","r":"Team Leader"},{"id":"m2","n":"Hassan Tamer"},{"id":"m3","n":"Youssef Islam"},{"id":"m4","n":"Momen Ahmed"},{"id":"m5","n":"Omar Adel"},{"id":"m6","n":"Hazem Elrefaie"},{"id":"m7","n":"Momen Saber"},{"id":"m8","n":"Menna Allah Tarek"}],tasks:[],subs:{},adj:[],pend:{},reqs:{},ext:{},av:{},cheers:{},comm:{},ch:{}};
let admin=false,tab="board",timer,sel=[],pend=null,fm="",cred=null,me="",clearQ=[],clearR=[];try{me=localStorage.getItem("me")||""}catch(e){}
try{cred=JSON.parse(sessionStorage.getItem("cred")||"null");admin=!!cred}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ini=n=>n.split(" ").map(w=>w[0]).slice(0,2).join("");
const hue=i=>i*47+330;
const avH=m=>{const a=(S.av||{})[m.id];return a&&a.h!=null?a.h:hue(S.members.indexOf(m))};
const avT=m=>{const a=(S.av||{})[m.id];return a&&a.e?esc(a.e):ini(m.n)};
const M=id=>S.members.find(m=>m.id===id);
const now=()=>Date.now();
const mine=(t,m)=>!t.a||!t.a.length||t.a.includes(m.id);
const dl=(t,m)=>t.d+((S.ext||{})[t.id+"|"+m]||0)*2*864e5;
const exLeft=m=>Math.max(0,3-Object.keys(S.ext||{}).filter(k=>k.endsWith("|"+m)).length);
const doneBy=(t,m)=>{const s=S.subs[t.id+"|"+m];return s&&!s.rej};
const fin=t=>{const A=S.members.filter(m=>mine(t,m));return A.length>0&&A.every(m=>doneBy(t,m.id))};
let loaded=false,picked=0;try{picked=sessionStorage.getItem("picked")?1:0}catch(e){}
const eff=()=>document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("th",t)}catch(e){}}
try{const t=localStorage.getItem("th");if(t)document.documentElement.dataset.theme=t}catch(e){}
function arrows(R){let st={};try{st=JSON.parse(localStorage.getItem("rk")||"{}")}catch(e){}const cur={};R.forEach(r=>cur[r.m.id]=r.rk);
 if(!st.cur)st={prev:cur,cur};else if(JSON.stringify(st.cur)!==JSON.stringify(cur))st={prev:st.cur,cur};
 try{localStorage.setItem("rk",JSON.stringify(st))}catch(e){}R.forEach(r=>r.mv=(st.prev[r.m.id]||r.rk)-r.rk)}
const mvTag=r=>r.mv>0?`<span class="mv pos">▲${r.mv}</span>`:r.mv<0?`<span class="mv neg">▼${-r.mv}</span>`:"";
const nmOf=id=>(M(id)||{n:"?"}).n,tt=id=>(S.tasks.find(t=>t.id===id)||{t:"?"}).t;
const sh=m=>{const w=m.n.split(" ");return w[0]+(w[0]==="Youssef"||w[0]==="Momen"?" "+w[1]:"")+(m.r?" (Team Leader)":"")};
const nm=m=>esc(m.n)+(m.r?' <small style="color:var(--cy)">(Team Leader)</small>':"");
const lvl=p=>p>=100?"🫀 Cardiac Legend":p>=60?"🩺 Consultant":p>=30?"💉 Specialist":p>=10?"🧑‍⚕️ Resident":"🌱 Intern";
function stats(m){let p=0,ok=0,late=0,bonus=0,first=0,pend=0,early=0,ice=0,clutch=0;const T=S.tasks.filter(t=>mine(t,m));
 T.forEach(t=>{const s=S.subs[t.id+"|"+m.id];if(s){if(s.ok){p+=t.p;ok++;{const g=dl(t,m.id)-s.at;if(g>=864e5)early++;if(g>=2592e5)ice++;if(g>=0&&g<36e5)clutch++}}else if(!s.rej)late++}else if(dl(t,m.id)>now())pend++});
 S.adj.forEach(a=>{if(a.m===m.id)bonus+=a.p});chRes().forEach(x=>{if(x.w===m.id)bonus+=CH});
 T.forEach(t=>{let b=null;S.members.forEach(x=>{const s=S.subs[t.id+"|"+x.id];if(s&&s.ok&&(!b||s.at<b.at))b={at:s.at,id:x.id}});if(b&&b.id===m.id)first++});
 let streak=0;T.filter(t=>dl(t,m.id)<now()||S.subs[t.id+"|"+m.id]).sort((a,b)=>b.d-a.d).some(t=>{const s=S.subs[t.id+"|"+m.id];if(s&&s.ok){streak++;return false}return true});
 return{p:p+bonus,ok,late,bonus,first,streak,perfect:T.length>0&&ok===T.length,pend,early,ice,clutch}}
function ranked(){const R=S.members.map((m,i)=>({m,i,...stats(m)})).sort((a,b)=>b.p-a.p||(b.m.r?1:0)-(a.m.r?1:0)||b.ok-a.ok);R.forEach((r,i)=>r.rk=i+1);if(loaded)arrows(R);return R}
function badges(r,top){let b="";if(top)b+="👑";if(r.streak>=3)b+="🔥";if(r.first)b+="⚡";if(r.perfect)b+="💯";if(r.bonus>0)b+="🎁";if(r.early)b+="🐦";if(r.ice)b+="❄️";if(r.clutch)b+="🦉";return b}
function left(ms){let s=Math.floor(Math.abs(ms)/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+"d ":"")+h+"h "+m+"m "+(s%60)+"s"}
const CH=5,openC=new Set();
document.addEventListener("toggle",e=>{const d=e.target;if(d&&d.dataset&&d.dataset.c){d.open?openC.add(d.dataset.c):openC.delete(d.dataset.c)}},true);
let AC=null;const muted=()=>{try{return localStorage.getItem("mute")==="1"}catch(e){return false}};
function snd(t){if(muted())return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();const T=AC.currentTime;
 const tone=(f,st,d,v,ty)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty||"sine";o.frequency.setValueAtTime(f,T+st);g.gain.setValueAtTime(.0001,T+st);g.gain.exponentialRampToValueAtTime(v,T+st+.02);g.gain.exponentialRampToValueAtTime(.0001,T+st+d);o.connect(g);g.connect(AC.destination);o.start(T+st);o.stop(T+st+d+.05)};
 if(t==="beat"){tone(110,0,.16,.6,"triangle");tone(85,.22,.24,.5,"triangle");tone(110,.9,.16,.5,"triangle");tone(85,1.12,.24,.4,"triangle")}
 else if(t==="up")[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.3,.25,"triangle"));
 else tone(880,0,.12,.2,"triangle")}catch(e){}}
const lvIdx=p=>p>=100?4:p>=60?3:p>=30?2:p>=10?1:0;
function popup(html){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="card" style="text-align:center">${html}<button class="btn p" style="width:100%;margin-top:10px">OK 🚀</button></div>`;o.onclick=e=>{if(e.target===o||e.target.tagName==="BUTTON")o.remove()};document.body.appendChild(o);boom();snd("up")}
function checkLevel(R){if(admin||!picked||!loaded||!M(me))return;const r=R.find(x=>x.m.id===me);if(!r)return;const i=lvIdx(r.p);let st=null;try{st=localStorage.getItem("lv_"+me)}catch(e){}try{localStorage.setItem("lv_"+me,i)}catch(e){}
 if(st!==null&&i>+st)popup(`<div style="font-size:60px" class="heart">🎉</div><h2 style="margin:6px 0">LEVEL UP!</h2><div style="font-size:22px;font-weight:800">${lvl(r.p)}</div><p class="tags">Keep going, ${esc(r.m.n.split(" ")[0])}!</p>`)}
const weekStart=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()-((d.getDay()+1)%7)*864e5};
function chRes(){const out=[];Object.entries(S.ch||{}).forEach(([id,c])=>{if(!c||c.st!=="on")return;const T=S.tasks.find(x=>x.id===c.t);if(!T)return;const sa=S.subs[c.t+"|"+c.a],sb=S.subs[c.t+"|"+c.b],oa=sa&&sa.ok,ob=sb&&sb.ok;let w=null,at=0;
 if(oa&&ob){w=sa.at<=sb.at?c.a:c.b;at=Math.max(sa.at,sb.at)}else if(oa&&(sb||dl(T,c.b)<now())){w=c.a;at=sa.at}else if(ob&&(sa||dl(T,c.a)<now())){w=c.b;at=sb.at}
 if(w)out.push({id,c,w,at})});return out}
function weekPts(){const ws=weekStart(),o={};S.members.forEach(m=>o[m.id]=0);
 S.tasks.forEach(t=>S.members.forEach(m=>{const s=S.subs[t.id+"|"+m.id];if(s&&s.ok&&mine(t,m)&&s.at>=ws)o[m.id]+=t.p}));
 S.adj.forEach(a=>{if(a.at>=ws&&o[a.m]!=null)o[a.m]+=a.p});chRes().forEach(x=>{if(x.at>=ws&&o[x.w]!=null)o[x.w]+=CH});return o}

 S.adj.forEach(a=>{const P=M(a.m);if(P&&a.p>0)w.push({at:a.at,k:"a:"+a.at+"|"+a.m,o:a.m,h:`🎁 <b>${esc(P.n)}</b> <span class="pos">+${a.p}</span> ${esc(a.r||"")}`})});
 chRes().forEach(x=>w.push({at:x.at,k:"c:"+x.id+"|"+x.w,o:x.w,h:`⚔️ <b>${esc(nmOf(x.w))}</b> won a duel <span class="pos">+${CH}</span>`}));w.sort((a,b)=>b.at-a.at);

 const chip=m=>{const k=t.id+"|"+m.id,s=S.subs[k],pd=(S.pend||{})[k],D=dl(t,m.id),ov=D<now(),c=s?(s.rej?"miss":s.ok?"ok":"late"):pd?"pd":(ov?"miss":""),ic=s?(s.rej?"❌ ":s.ok?"✅ ":"⏰ "):pd?"⏳ ":(ov?"🔴 ":""),fz=s&&!s.rej?` <small>🧊 ${left(D-s.at)} ${D>=s.at?"early":"late"}</small>`:pd?` <small>⏸ ${left(D-pd)} ${D>=pd?"left":"late"}</small>`:"",l=ic+esc(sh(m))+((S.ext||{})[k]?" 🛡":"")+fz;return admin?`<button class="chip ${c}" data-a="tog" data-t="${t.id}" data-m="${m.id}">${l}</button>`:`<span class="chip ${c}">${l}</span>`};
 const mm=M(me),k0=t.id+"|"+me,duel=(!admin&&mm)?duelHTML(t):"",cm=(admin||(mm&&mine(t,mm)))?cmtHTML(t):"",s0=S.subs[k0],btn=(!admin&&mm&&mine(t,mm))?((S.pend||{})[k0]?'<div class="tags" style="margin-top:8px">⏳ Waiting for approval…</div>':(s0&&!s0.rej)?"":`<button class="btn p" data-a="done" data-t="${t.id}" style="margin-top:8px;width:100%">${s0&&s0.rej?"❌ Declined — submit again":"✅ I'm done"}</button>`):"";
 const can=!admin&&(!mm||(mine(t,mm)&&!s0&&!(S.pend||{})[k0])),reqd=Object.values(S.reqs||{}).some(r=>r.ty==="ext"&&r.t===t.id&&r.m===me),
 exb=reqd?'<span class="chip pd">🛡 Exception requested — waiting for approval ⏳</span>':(mm&&(S.ext||{})[k0])?'<span class="chip ok">🛡 Exception granted +2 days</span>':(mm&&exLeft(me)<=0)?'<span class="chip">🛡 No exceptions left</span>':`<button class="chip exc" data-a="ext" data-t="${t.id}"><span class="sh">🛡</span> Exception +2 days${mm?" ("+exLeft(me)+" left)":""}</button>`,
 xtra=can?`${mm?`<div class="tags" style="margin-top:8px">⏱ Your time left: <span class="cd" data-d="${dl(t,me)}">${left(dl(t,me)-now())}</span></div>`:""}<div class="chips" style="margin-top:6px">${exb}${mm?`<button class="chip" data-a="chal" data-t="${t.id}">⚔️ Challenge</button>`:""}${mm&&t.a&&t.a.includes(me)?`<button class="chip" data-a="swap" data-t="${t.id}">🔄 Swap</button>`:""}</div>`:"";
 return`<div class="card task ${over||t.d-now()>864e5?"":"hot"}"><h3><span>${esc(t.t)}</span><span class="badge" style="background:var(--cy);color:#001">${t.p} pts</span></h3>${t.x?`<div class="desc">${esc(t.x)}</div>`:""}<div class="meta">Due ${new Date(t.d).toLocaleString()} · <span class="cd ${over?"over":""}" data-d="${t.d}">${over?"closed":left(t.d-now())}</span></div>${admin?`<div class="meter"><i style="width:${A.length?done/A.length*100:0}%"></i></div>`:""}<div class="tags" style="margin:4px 0 8px">${admin?`${t.a&&t.a.length?"📌 Assigned to "+A.length:"🌍 Whole team"} · ${done}/${A.length} on time`:(t.a&&t.a.length?"📌 Assigned to you":"🌍 Whole team task")}</div><div class="chips">${(admin?A:A.filter(m=>m.id===me)).map(chip).join("")}</div>${duel}${btn}${xtra}${cm}</div>`}
function countUp(){document.querySelectorAll("[data-n]").forEach(e=>{const n=+e.dataset.n,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900);e.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)});setTimeout(()=>document.querySelectorAll("[data-w]").forEach(e=>e.style.width=e.dataset.w+"%"),60)}
setInterval(()=>document.querySelectorAll(".cd[data-d]").forEach(e=>{const d=+e.dataset.d;if(d)e.textContent=d>now()?left(d-now()):(e.dataset.z||"closed")}),1000);
function toast(m){const t=document.createElement("div");t.id="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function boom(){const c=document.createElement("canvas");c.width=innerWidth;c.height=innerHeight;$("#fx").appendChild(c);const x=c.getContext("2d"),P=[...Array(90)].map(()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:-Math.random()*14-3,c:`hsl(${Math.random()*360} 90% 60%)`,s:4+Math.random()*5}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s)});if(++f<110)requestAnimationFrame(a);else c.remove()})()}
function save(delay){clearTimeout(timer);timer=setTimeout(async()=>{try{const cl=clearQ.slice(),cr=clearR.slice(),r=await fetch("/api/state",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...cred,state:S,clear:cl,clearReq:cr})});if(!r.ok)throw 0;clearQ=clearQ.filter(k=>!cl.includes(k));clearR=clearR.filter(k=>!cr.includes(k))}catch(e){toast("⚠️ Couldn't save — check your login / connection")}},delay||700)}
function change(delay){render();save(delay)}
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function loginUI(){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="card"><h3>🔐 Admin login</h3><div class="form"><input id="lu" placeholder="Username" style="width:100%"><input id="lp" type="password" placeholder="Password" style="width:100%"><button class="btn p" id="lg" style="width:100%">Enter</button><button class="btn" id="lc" style="width:100%">Cancel</button></div></div>`;document.body.appendChild(o);
 $("#lc").onclick=()=>o.remove();
 $("#lg").onclick=async()=>{const c={user:$("#lu").value.trim(),pass:$("#lp").value};let ok=false;try{ok=(await fetch("/api/state",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...c,login:true})})).ok}catch(e){}
 if(ok){cred=c;admin=true;try{sessionStorage.setItem("cred",JSON.stringify(c));sessionStorage.setItem("picked","1")}catch(e){}picked=1;o.remove();render();toast("Welcome back, Leader 👑");boom()}else toast("Wrong username or password")}}
function resolve(k,ap){const T=S.tasks.find(t=>t.id===k.split("|")[0]);if(!T)return;const at=+S.pend[k]||now(),ok=at<=dl(T,k.split("|")[1]);S.subs[k]=ap?{at,ok}:{at,ok:false,rej:1};delete S.pend[k];clearQ.push(k);
 if(ap&&ok){boom();snd("beat");toast("+"+T.p+" points! 🎉")}else toast(ap?"Approved late — 0 pts":"Declined ❌");change(ap&&ok?2200:700)}
async function sendDone(t){if(!me)return toast("Pick your name first");try{const r=await fetch("/api/state",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({act:"done",task:t,member:me})});
 if(r.ok){S.pend=S.pend||{};S.pend[t+"|"+me]=now();toast("Sent for approval ⏳");render()}else{toast(r.status===409?"Already recorded":"Couldn't send, try again");load(true)}}catch(e){toast("Couldn't send, check your connection")}}
function doSwap(t1,m1,t2,m2){const A=S.tasks.find(t=>t.id===t1),B=S.tasks.find(t=>t.id===t2);if(!A||!B||t1===t2||m1===m2||!A.a||!B.a||!A.a.includes(m1)||!B.a.includes(m2)||A.a.includes(m2)||B.a.includes(m1)||S.subs[t1+"|"+m1]||S.subs[t2+"|"+m2]||(S.pend||{})[t1+"|"+m1]||(S.pend||{})[t2+"|"+m2])return false;A.a=A.a.map(x=>x===m1?m2:x);B.a=B.a.map(x=>x===m2?m1:x);return true}
async function post(b,msg){try{const r=await fetch("/api/state",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)});if(r.ok){if(msg)toast(msg);load(true)}else toast(r.status===409?"Already requested / not allowed":"Couldn't send")}catch(e){toast("Connection problem")}}
function swapUI(t1){const T1=S.tasks.find(x=>x.id===t1),L=[];S.tasks.forEach(t2=>{if(t2.id===t1||!t2.a||!t2.a.length||fin(t2)||t2.a.includes(me))return;t2.a.forEach(m2=>{if(!M(m2)||T1.a.includes(m2)||S.subs[t2.id+"|"+m2]||(S.pend||{})[t2.id+"|"+m2])return;L.push([t2,m2])})});
 const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="card"><h3>🔄 Swap with…</h3><div class="chips" style="flex-direction:column">${L.map(([t2,m2],i)=>`<button class="chip" data-i="${i}" style="text-align:left">${esc(sh(M(m2)))} — ${esc(t2.t)}</button>`).join("")||'<span class="tags">No one to swap with right now</span>'}</div><button class="btn" id="sc" style="width:100%;margin-top:10px">Close</button></div>`;document.body.appendChild(o);
 o.onclick=e=>{if(e.target.id==="sc"||e.target===o)return o.remove();const i=e.target.dataset.i;if(i==null)return;o.remove();const[t2,m2]=L[i];post({act:"swap",t1,m1:me,t2:t2.id,m2},"Swap request sent 🔄")}}
document.addEventListener("change",e=>{if(e.target.id==="me"){me=e.target.value;try{localStorage.setItem("me",me)}catch(x){}fm=me;render()}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-a],[data-tab]");if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;return render()}
 const a=b.dataset.a;
 if(a==="login")return loginUI();
 if(a==="pick"){me=b.dataset.m;try{localStorage.setItem("me",me)}catch(x){}picked=1;try{sessionStorage.setItem("picked","1")}catch(x){}fm=me;tab="board";return render()}
 if(a==="switch"){picked=0;try{sessionStorage.removeItem("picked")}catch(x){}return render()}
 if(a==="out"){admin=false;cred=null;try{sessionStorage.removeItem("cred");sessionStorage.removeItem("picked")}catch(e){}picked=0;tab="board";return render()}
 if(a==="done")return sendDone(b.dataset.t);
 if(a==="ext"){if(!me)return toast("Pick your name first");if(b.classList.contains("fire"))return;b.classList.add("fire");const tid=b.dataset.t;setTimeout(()=>post({act:"ext",task:tid,member:me},"Exception requested 🛡 — waiting for approval"),700);return}
 if(a==="swap")return swapUI(b.dataset.t);
 if(a==="mute"){try{localStorage.setItem("mute",muted()?"0":"1")}catch(x){}if(!muted())snd("pop");return render()}
 if(a==="avatar")return avatarUI();
 if(a==="chal")return chalUI(b.dataset.t);
 if(a==="chacc"||a==="chdec")return post({act:"chal",op:a==="chacc"?"acc":"dec",id:b.dataset.id,member:me},a==="chacc"?"Duel accepted ⚔️":"Declined");
 if(a==="cheer"){const k=b.dataset.k;S.cheers=S.cheers||{};if(!me||S.cheers[k+"~"+me])return;S.cheers[k+"~"+me]=1;snd("pop");render();return post({act:"cheer",key:k,member:me},"")}
 if(a==="cmt"){const t=b.dataset.t,x=($("#cm_"+t).value||"").trim();if(!x)return;openC.add(t);return post({act:"comment",task:t,text:x,...(admin?cred:{member:me})},"Sent 💬")}
 if(a==="theme"){setTheme(eff()==="dark"?"light":"dark");return}
 if(a==="fm"){fm=b.dataset.m||"";return render()}
 if(!admin)return;
 if(a==="dswap"){const[a1,b1]=$("#sw1").value.split("|"),[a2,b2]=$("#sw2").value.split("|");if(!a1||!a2||!doSwap(a1,b1,a2,b2))return toast("Can't swap these two");boom();toast("🔄 Swapped!");return change()}
 if(a==="fd"){const v=new Date($("#fdi").value).getTime();if(!v)return toast("Pick a date");S.fd=v;toast("⏳ Saved");return change()}
 if(a==="fdc"){delete S.fd;return change()}
 if(a==="gex"){const v=$("#ex1").value;if(!v)return toast("Pick a task");S.ext=S.ext||{};S.ext[v]=1;boom();toast("🛡 +2 days granted");return change()}
 if(a==="rex"){const v=$("#ex1").value;if(!v||!(S.ext||{})[v])return toast("No exception on this one");delete S.ext[v];toast("Exception removed");return change()}
 if(a==="lucky"){const p=+$("#lp2").value||5,el=$("#lkr"),w=Math.floor(Math.random()*S.members.length);let i=0;const iv=setInterval(()=>{el.textContent="🎰 "+S.members[i++%S.members.length].n},90);setTimeout(()=>{clearInterval(iv);const W=S.members[w];el.textContent="🎉 "+W.n+" +"+p;S.adj.push({m:W.id,p,r:"🎰 Lucky draw",at:now()});boom();save(500)},2600);return}
 if(a==="rq"){const id=b.dataset.id,r=S.reqs[id],ap=b.dataset.v==="1";delete S.reqs[id];clearR.push(id);S.ext=S.ext||{};
  if(ap&&r.ty==="ext"){if(exLeft(r.m)>0){S.ext[r.t+"|"+r.m]=1;toast("🛡 +2 days granted")}}
  else if(ap&&r.ty==="swap"){if(doSwap(r.t1,r.m1,r.t2,r.m2)){toast("🔄 Swapped!");boom()}else toast("Swap no longer valid")}
  else toast("Declined");return change()}
 if(a==="apv")return resolve(b.dataset.k,true);
 if(a==="dec")return resolve(b.dataset.k,false);
 if(a==="tog"){const k=b.dataset.t+"|"+b.dataset.m,T=S.tasks.find(t=>t.id===b.dataset.t),s=S.subs[k];
  if(!s&&(S.pend||{})[k])return resolve(k,true);
  if(!s){const ok=now()<=dl(T,b.dataset.m);S.subs[k]={at:now(),ok};if(ok){boom();snd("beat");toast("+"+T.p+" points! 🎉");return change(2200)}toast("Submitted after deadline — 0 pts");return change()}
  if(s.ok){S.subs[k]={at:s.at,ok:false};return change()}
  if(!s.rej){S.subs[k]={at:s.at,ok:false,rej:1};return change()}
  delete S.subs[k];return change()}
 if(a==="addtask"){const t=$("#tt").value.trim(),d=new Date($("#td").value).getTime(),p=+$("#tp").value;if(!t||!d||!p)return toast("Fill title, deadline and points");S.tasks.push({id:"t"+now(),t,d,p,a:[...sel],x:$("#tx").value.trim()});sel=[];tab="tasks";return change()}
 if(a==="sel"){const m=b.dataset.m;sel=sel.includes(m)?sel.filter(x=>x!==m):[...sel,m];b.classList.toggle("on");return}
 if(a==="sdesc"){const T=S.tasks.find(t=>t.id===b.dataset.t);T.x=$("#ed_"+T.id).value.trim();toast("Saved ✏️");return change()}
 if(a==="asg"){const T=S.tasks.find(t=>t.id===b.dataset.t),m=b.dataset.m;T.a=T.a||[];T.a=T.a.includes(m)?T.a.filter(x=>x!==m):[...T.a,m];return change()}
 if(a==="deltask"){const id=b.dataset.t;if(pend!==id){pend=id;render();setTimeout(()=>{if(pend===id){pend=null;render()}},4000);return}
  pend=null;S.tasks=S.tasks.filter(t=>t.id!==id);Object.keys(S.subs).forEach(k=>{if(k.startsWith(id+"|"))delete S.subs[k]});Object.keys(S.pend||{}).forEach(k=>{if(k.startsWith(id+"|")){delete S.pend[k];clearQ.push(k)}});return change()}
 if(a==="adj"){const p=+$("#bp").value;if(!p)return toast("Enter points (+ or -)");S.adj.push({m:$("#bm").value,p,r:$("#br").value.trim(),at:now()});if(p>0)boom();$("#bp").value="";return change(p>0?2200:700)}
 if(a==="deladj"){S.adj.splice(+b.dataset.i,1);change()}});
async function load(full){try{const r=await fetch("/api/state",{cache:"no-store"});if(!r.ok)return;const d=await r.json();if(!d||!d.members)return;const was=loaded;loaded=true;d.pend=d.pend||{};d.reqs=d.reqs||{};d.ext=d.ext||{};d.av=d.av||{};d.cheers=d.cheers||{};d.comm=d.comm||{};d.ch=d.ch||{};
 if(admin&&!full){const o2=JSON.stringify([S.av,S.cheers,S.comm,S.ch]),old=Object.keys(S.pend||{}).length+Object.keys(S.reqs||{}).length;S.pend=d.pend;S.reqs=d.reqs;S.av=d.av;S.cheers=d.cheers;S.comm=d.comm;S.ch=d.ch;clearQ.forEach(k=>delete S.pend[k]);clearR.forEach(k=>delete S.reqs[k]);const n=Object.keys(S.pend).length+Object.keys(S.reqs).length;if(n!==old||o2!==JSON.stringify([S.av,S.cheers,S.comm,S.ch])){if(n>old)toast("🔔 New approval request");if(tab!=="admin")render()}}
 else if(JSON.stringify(d)!==JSON.stringify(S)){if(was&&me&&!admin&&Object.keys(d.subs||{}).some(k=>k.endsWith("|"+me)&&d.subs[k].ok&&!(S.subs[k]&&S.subs[k].ok))){snd("beat");toast("✅ Approved! 🫀")}S=d;render()}}catch(e){}}
render();load(true);setInterval(()=>load(false),15000);
</script>
